name: test

on:
  push:
  pull_request:

jobs:
  roofline-reward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # CPU-only: the roofline reward is importable without torch or a GPU.
      - run: python -m pytest -q tests
